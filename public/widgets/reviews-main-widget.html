<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yotpo Reviews Main Widget</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
      body {
        padding: 24px;
        min-height: 100vh;
      }
      #widget_container {
        width: 100%;
        max-width: 100%;
      }
      .loading-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 60px 20px;
        color: #64748b;
        font-size: 14px;
        font-weight: 500;
      }
      .loading-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #e2e8f0;
        border-top-color: #60a4ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .yotpo-widget-error {
        padding: 16px;
        border-radius: 12px;
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="widget_container"></div>
    <script type="text/javascript">
      (function () {
        function renderInWidgetContainer(appKey, productId, widgetId) {
          document.querySelector("#widget_container").innerHTML =
            `<div class="yotpo-widget-instance" data-yotpo-instance-id="${widgetId}" data-yotpo-product-id="${productId}"><div class="loading-placeholder"><div class="loading-spinner"></div><span>Loading Yotpo widget...</span></div></div>`;
        }
        function renderErrorInWidgetContainer(errorMessage) {
          document.querySelector("#widget_container").innerHTML =
            `<div class="yotpo-widget-error">${errorMessage}</div>`;
        }
        const appKey = new URLSearchParams(window.location.search).get(
          "appKey",
        );
        if (!appKey || appKey.trim() === "") {
          renderErrorInWidgetContainer("Missing appKey parameter");
          return;
        }
        const productId = new URLSearchParams(window.location.search).get(
          "productId",
        );
        if (!productId || productId.trim() === "") {
          renderErrorInWidgetContainer("Missing productId parameter");
          return;
        }
        const widgetId = new URLSearchParams(window.location.search).get(
          "widgetId",
        );
        if (!widgetId || widgetId.trim() === "") {
          renderErrorInWidgetContainer("Missing widgetId parameter");
          return;
        }
        renderInWidgetContainer(appKey, productId, widgetId);
        var e = document.createElement("script");
        ((e.type = "text/javascript"),
          (e.async = true),
          (e.src = `//cdn-widgetsrepository.yotpo.com/v1/loader/${appKey}`));
        var t = document.getElementsByTagName("script")[0];
        t.parentNode.insertBefore(e, t);
      })();
    </script>
  </body>
</html>
